_genre_contents: { vocab_genre_id: sub_ids }) if sub_ids.present? && search_mode == 1","      stud.each do |s|","        stud_arr[s.user_id] ||= []","        stud_arr[s.user_id] = stud_arr[s.user_id] + s.vocab_code_arr","      end","","      @stud_rates = {}","      stud_arr.each do |k,v|","        res = 0","        comp_arr.each do |a|","          res += 1 if stud_arr[k].include?(a)","        end","        calc_rate = ((res * 100).to_f / comp_arr.length).round(2)","        if calc_rate >= rate.to_f","          @stud_rates[k] = calc_rate","        end","      end","      a = @stud_rates.sort_by{|k,v| v}.reverse.to_h","","      @offers = User.joins(:profile).in_order_of(:id, a.keys)","      @offers = @offers.page(params[:page]).per(params[:per])","    end","","    respond_to do |format|","      format.html","      format.js","    end","  end","","  def mail_request","    redirect_to kaisha_offers_path, flash: {alert: 'Please select.'} and return if params[:offer].blank?","    ids = params[:offer][:ids]","    email = 'h.renji@hotmail.com,ogadaisuke0303@gmail.com'","    entry_no = User.find(ids).map(&:entry_no).join(', ')","    Kaisha::KaishaMailer.notify(email, current_comp.email, current_comp.company_name, current_comp.business_type, entry_no).deliver_now","  end","end"],"lines":[0,0,0,null,0,0,0,0,null,0,0,null,0,0,0,0,0,0,0,null,0,null,0,0,0,0,0,null,0,null,0,0,0,null,null,0,null,0,0,0,0,0,null,null,0,0,0,0,0,null,0,0,0,null,null,0,null,0,0,null,null,0,0,0,null,null,null,0,0,0,0,0,0,null,null],"lines_covered_percent":0.0,"covered_lines":0,"missed_lines":52,"omitted_lines":23,"total_lines":52,"branches":[{"type":"then","start_line":6,"end_line":59,"coverage":0,"inline":false,"report_line":5},{"type":"else","start_line":5,"end_line":60,"coverage":0,"inline":true,"report_line":5},{"type":"then","start_line":12,"end_line":21,"coverage":0,"inline":true,"report_line":12},{"type":"else","start_line":12,"end_line":21,"coverage":0,"inline":true,"report_line":12},{"type":"bo \"N2\"=>2, \"N1\"=>1 }","    read = {}; learned = {}; remaining = {}","","    levels.each do |label, level|","      total = VocabTable.where(jlpt_level: level).count","      user_cards = @user.vocab_mycards.joins(:vocab_table)","                        .where(vocab_tables: { jlpt_level: level })","","      r = user_cards.where(mycard_level: 0).count","      l = user_cards.where(mycard_level: 1).count","      rem = [total - r - l, 0].max","","      read[label]      = percent(r, total)","      learned[label]   = percent(l, total)","      remaining[label] = percent(rem, total)","    end","","    [","      { name: \"Read\", data: read },","      { name: \"Learned\", data: learned },","      { name: \"Remaining\", data: remaining }","    ]","  end","","","  def genre_chart","    result = {}","    genres = VocabGenre.where(vocab_genre_id: nil).order(:sort)","    genres.each do |grs|","      table_ids = [grs.id]","      total = 0","      read_count    = 0","      learned_count = 0","      remaining     = 0","      while id = table_ids.shift","        genre = VocabGenre.find(id)","","        total += genre.vocab_tables.count","","        cards = @user.vocab_mycards","                   .joins(vocab_table: :vocab_genre_contents)","                   .where(vocab_genre_contents: { vocab_genre_id: genre.id })","","        counts = cards.group(:mycard_level).count","","        read_count    += counts[0] || 0","        learned_count += counts[1] || 0","        remaining += [genre.vocab_tables.count - (counts[0] || 0) - (counts[1] || 0), 0].max","","        table_ids += genre.sub_genres.where(hide_flg: false).pluck(:id)","      end","      result[grs.title] = {","        id: grs.id,","        read: percent(read_count, total),","        learned: percent(learned_count, total),","        remaining: percent(remaining, total),","        user_id: @user.id","      }","    end","    result","  end","","  def sub_genre_chart(params)","    sub_genres = []","    genres = VocabGenre.where(vocab_genre_id: params[:genre_id])","    genres.each do |grs|","      table_ids = [grs.id]","      total = 0","      progress = 0","      while id = table_ids.shift","        genre = VocabGenre.find(id)","","        total += genre.vocab_tables.count","","        cards = @user.vocab_mycards","                   .joins(vocab_table: :vocab_genre_contents)","                   .where(vocab_genre_contents: { vocab_genre_id: genre.id })","","        counts = cards.group(:mycard_level).count","","        read_count    = counts[0] || 0","        learned_count = counts[1] || 0","        progress += read_count  + learned_count","","        table_ids += genre.sub_genres.where(hide_flg: false).pluck(:id)","      end","      sub_genres \u003c\u003c {","        id: grs.id,","        name: grs.title,","        progress: percent(progress, total),","        user_id: @user.id","      }","    end","    sub_genres","  end","","  private","","  def percent(value, total)","    total.zero? ? 0 : (value * 100.0 / total).round(1)","  end","","  def group_by_period(cards, start_date, end_date, period, column)","    data = initialize_range(start_date, end_date, period)","    cards.where(column => start_date..end_date).each do |card|","      data[key(card[column], period)] += 1","    end","    data","  end","","  def initialize_range(start_date, end_date, period)","    data = {}","    d = start_date","    while d \u003c= end_date","      data[key(d, period)] = 0","      d = advance(d, period)","    end","    data","  end","","  def key(date, period)","    case period","    when 'week'  then date.beginning_of_week.strftime('%Y-%m-%d')","    when 'month' then date.beginning_of_month.strftime('%Y-%m-%d')","    when 'year'  then date.beginning_of_year.strftime('%Y-%m-%d')","    end","  end","","  def advance(date, period)","    date + { 'week'=>1.week, 'month'=>1.month, 'year'=>1.year }[period]","  end","end"],"lines":[0,0,0,null,null,0,0,0,null,null,0,null,null,null,null,0,0,0,null,0,null,0,0,null,
